# push -> собрать exe+zip -> подписать version.json -> релиз в pcrc-versions
# -> клиенты сами обновляются (v1 берут exe по url, новые берут zip_url).
name: build-and-release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: build-and-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # ref = ветка (не SHA присылаемого коммита): учитывает version-bump
      # предыдущего прогона при быстрых пушах подряд
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine next version
        id: ver
        shell: bash
        run: |
          LAST=$(tr -d '[:space:]' < VERSION)
          NEW=$((LAST + 1))
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^CLIENT_VERSION[[:space:]]*=[[:space:]]*[0-9]+/CLIENT_VERSION   = $NEW/" client_final.py
          grep -n "^CLIENT_VERSION" client_final.py

      - name: Create venv + install deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip -q
          .\.venv\Scripts\python.exe -m pip install -r requirements-client.txt -q

      - name: Build RemoteControl.exe + RemoteControlPanel.exe + release zip
        shell: pwsh
        run: |
          .\build-client.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Hash + sign version.json
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          New-Item -ItemType Directory -Force .signing | Out-Null
          ($env:UPDATE_SIGNING_KEY -replace "`r`n", "`n") |
            Set-Content -Path .signing\update_signing_private.pem -NoNewline -Encoding ascii
          $ver = '${{ steps.ver.outputs.new }}'
          $exeHash = (Get-FileHash dist\RemoteControl.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash dist\RemoteControl-release.zip -Algorithm SHA256).Hash.ToLower()
          $meta = [ordered]@{
            version    = [int]$ver
            url        = "https://github.com/look-afk/pcrc-versions/releases/download/v$ver/RemoteControl.exe"
            sha256     = $exeHash
            zip_url    = "https://github.com/look-afk/pcrc-versions/releases/download/v$ver/RemoteControl-release.zip"
            zip_sha256 = $zipHash
          }
          $meta | ConvertTo-Json | Set-Content -Path version.json -Encoding ascii
          .\.venv\Scripts\python.exe sign-version.py version.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content version.json

      - name: Create release + upload assets (pcrc-versions)
        shell: pwsh
        env:
          VERSIONS_PAT: ${{ secrets.VERSIONS_PAT }}
        run: |
          $ver = '${{ steps.ver.outputs.new }}'
          $tag = "v$ver"
          $headers = @{
            Authorization = "Bearer $env:VERSIONS_PAT"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $rels = Invoke-RestMethod -Uri "https://api.github.com/repos/look-afk/pcrc-versions/releases?per_page=100" -Headers $headers
          $rel = $rels | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if (-not $rel) {
            $body = @{ tag_name = $tag; name = $tag; body = "Auto-release $tag from pcrc-client CI" } | ConvertTo-Json
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/look-afk/pcrc-versions/releases" -Headers $headers -Method Post -Body $body -ContentType "application/json"
          }
          $uploadBase = ($rel.upload_url -replace '\{\?name,label\}$', '')
          foreach ($asset in @(
            @{ file = 'dist\RemoteControl.exe'; name = 'RemoteControl.exe' },
            @{ file = 'dist\RemoteControl-release.zip'; name = 'RemoteControl-release.zip' }
          )) {
            $old = $rel.assets | Where-Object { $_.name -eq $asset.name }
            if ($old) { Invoke-RestMethod -Uri $old.url -Headers $headers -Method Delete | Out-Null }
            $out = curl.exe -f -sS -L `
              -H "Authorization: Bearer $env:VERSIONS_PAT" `
              -H "Content-Type: application/octet-stream" `
              --data-binary "@$($asset.file)" `
              "$uploadBase`?name=$($asset.name)"
            if ($LASTEXITCODE -ne 0) { Write-Error "upload failed $($asset.name): $out"; exit 1 }
            Write-Host "Uploaded $($asset.name)"
          }

      - name: Publish version.json (pcrc-versions)
        shell: pwsh
        env:
          VERSIONS_PAT: ${{ secrets.VERSIONS_PAT }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:VERSIONS_PAT"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path version.json)))
          $body = @{ message = "release: v${{ steps.ver.outputs.new }}"; content = $b64 }
          try {
            $cur = Invoke-RestMethod -Uri "https://api.github.com/repos/look-afk/pcrc-versions/contents/version.json" -Headers $headers
            $body['sha'] = $cur.sha
          } catch {}
          $json = $body | ConvertTo-Json
          $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/look-afk/pcrc-versions/contents/version.json" -Headers $headers -Method Put -Body $json -ContentType "application/json"
          Write-Host "version.json committed: $($resp.commit.sha)"

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Set-Content -Path VERSION -Value '${{ steps.ver.outputs.new }}' -NoNewline
          git add VERSION client_final.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "nothing to commit"; exit 0 }
          git commit -m "release: v${{ steps.ver.outputs.new }} [skip ci]"
          git push
